name: Deploy demos

# Deploys the live demo pages (web/) and their API (api/, Vercel Functions) to the Vercel project pharos-beacon
# when they change on main. Keys never pass through here: they are Vercel environment variables of the project.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "tasks/**"
      - "src/**"
      - "vercel.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demos
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Upload the source (.vercelignore trims it) and let Vercel build it: a --prebuilt upload of the traced
      # function dependencies is over Vercel's 15,000-file limit.
      - run: npx --yes vercel@53 deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
