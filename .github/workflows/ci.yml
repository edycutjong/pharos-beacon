name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Read-only and keyless: evaluates the mainnet policy through the hosted Pharos Chain MCP.
  live-mainnet-dry-run:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run guard -- tasks/threshold-guardian/policies/wpros-watch.json

  # Read-only and keyless: tools/list, searches, a page fetch and a question against the hosted Developer Docs MCP.
  # Advisory: it depends on a third-party, LLM-backed endpoint, so a failure here does not fail the workflow. The
  # client's own tests (including a local MCP server) run in the `test` job above.
  live-docs-mcp:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run smoke:docs
      - if: failure()
        run: echo "::warning::Developer Docs MCP live smoke failed (advisory job; the workflow still passes)"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks CLI over the full history (the gitleaks action fails on a root commit's `sha^` range).
      - run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
      - run: ./gitleaks detect --source . --log-opts=--all --redact --no-banner
